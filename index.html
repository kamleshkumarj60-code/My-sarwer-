<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9X NUMBER PRINCE HACK</title>
<style>
body{margin:0;background:#1a0f2e;font-family:Arial;display:flex;justify-content:center}
.box{width:390px;min-height:100vh;background:#1e123a;position:relative;padding-bottom:20px}
.top{display:flex;gap:8px;padding:10px}
.top div{flex:1;text-align:center;padding:8px;border-radius:8px 8px 0 0;color:#fff;font-weight:bold}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px}
.nums div{width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;background:#fff;box-shadow:0 0 10px #000}
.hbox{width:92%;margin:10px auto;background:#000;border:2px solid #ff0000;border-radius:15px;box-shadow:0 0 15px red;padding:10px;position:relative}
.hbox-head{color:#ff3b3b;font-size:13px;display:flex;justify-content:space-between;padding:5px}
.balls{display:flex;justify-content:center;gap:15px;margin:15px 0}
.ball{width:60px;height:60px;border-radius:50%;background:radial-gradient(#aaffaa,#00aa00);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:#fff;text-shadow:0 0 5px #000;box-shadow:0 0 15px #0f0}
.period{text-align:center;background:#220000;color:#fff;padding:6px;border-radius:5px;font-size:13px;letter-spacing:1px;margin:10px}
.btns{display:flex;margin-top:10px}
.ex{flex:1;background:linear-gradient(to right,#ff0000,#990000);color:#fff;border:0;padding:10px;font-weight:bold;border-radius:0 0 0 10px}
.hi{flex:1;background:#222;color:#fff;border:0;padding:10px;border-radius:0 0 10px 0}
.timer{text-align:center;color:#ffaa00;margin-top:10px;font-size:12px}
.dragon{position:fixed;bottom:80px;right:15px;width:65px;height:65px;background:#fff;border-radius:50%;border:2px solid gold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px gold;z-index:99}
</style>
</head>
<body>
<div class="box">
<div class="top">
<div style="background:#0f9d58">Green</div>
<div style="background:#a259ff">Violet</div>
<div style="background:#ff3d3d">Red</div>
</div>
<div class="nums">
<div style="color:purple;border:3px solid purple">0</div><div style="color:green;border:3px solid green">1</div><div style="color:red;border:3px solid red">2</div><div style="color:green;border:3px solid green">3</div><div style="color:red;border:3px solid red">4</div>
<div style="color:purple;border:3px solid purple">5</div><div style="color:red;border:3px solid red">6</div><div style="color:green;border:3px solid green">7</div><div style="color:red;border:3px solid red">8</div><div style="color:green;border:3px solid green">9</div>
</div>

<div class="hbox">
<div class="hbox-head"><span>9X NUMBER PRINCE P...</span><span style="border:1px solid #fff;padding:2px 6px;border-radius:10px;font-size:10px">GAME</span></div>
<div class="balls">
<div class="ball" id="b1">1</div>
<div class="ball" id="b2">1</div>
<div class="ball" id="b3">1</div>
</div>
<div class="period">PERIOD: <span id="per">0612</span></div>
<div class="timer">Next in: <span id="sec">60</span>s - Server: MADRA EDITION</div>
<div class="btns">
<button class="ex" onclick="execute()">EXECUTE</button>
<button class="hi" onclick="hide()">HIDE</button>
</div>
</div>

<div style="padding:10px;color:#555;font-size:11px;text-align:center">*Ye sirf demo design hai. Real prediction possible nahi hai.</div>
</div>

<div class="dragon">🐉</div>

<script>
let p=612;
function update(){
 let now=new Date();
 let min=now.getMinutes();
 let sec=60-now.getSeconds();
 document.getElementById('sec').innerText=sec;
 if(sec==60){
  p++;
  document.getElementById('per').innerText="0"+p;
  let n1=Math.floor(Math.random()*10);
  let n2=Math.floor(Math.random()*10);
  let n3=Math.floor(Math.random()*10);
  document.getElementById('b1').innerText=n1;
  document.getElementById('b2').innerText=n2;
  document.getElementById('b3').innerText=n3;
 }
}
function execute(){ alert('PREDICTION EXECUTED: Period '+document.getElementById('per').innerText); }
function hide(){ document.querySelector('.hbox').style.display='none'; }
setInterval(update,1000);
update();
</script>
</body>
</html>
