<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MADRA UCHIHA - limited edition</title>
<style>
body{margin:0;background:#000;font-family:Arial;display:flex;justify-content:center}
.main{width:380px;background:#110000;min-height:100vh;border:1px solid #333}
.header{background:#ff2d2d;color:#fff;padding:12px;text-align:center;font-weight:bold;letter-spacing:1px}
.left{width:110px;background:#000;padding:10px;float:left;min-height:90vh;text-align:center}
.btn{width:100%;background:#ff3d00;color:#fff;border:0;padding:10px;margin-top:10px;border-radius:5px;font-weight:bold}
.right{margin-left:130px;background:#0a0000;padding:10px;min-height:90vh}
.hack-head{background:#ff2d2d;color:#fff;padding:8px;display:flex;justify-content:space-between;font-size:12px}
.period-box{border:1px solid red;color:red;font-size:11px;padding:8px;margin-top:10px;text-align:center}
.big-result{background:#ff2d2d;color:#fff;text-align:center;padding:30px 10px;font-size:28px;font-weight:bold;margin-top:10px;letter-spacing:2px}
.predict{background:#ff3d00;color:#fff;border:0;width:100%;padding:15px;margin-top:15px;font-size:16px;font-weight:bold;border-radius:5px}
#timer{color:#ff5a5a;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="main">
<div class="header">MADRA UCHIHA - limited edition</div>
<div class="left">
<img src="https://i.ibb.co/0jZ8zQY/madara.png" style="width:80px;border-radius:50%">
<button class="btn" style="background:#222">SETTINGS</button>
<button class="btn">HACK</button>
<button class="btn" style="background:#222">OTHER</button>
<button class="btn" style="background:#222">JOIN</button>
</div>
<div class="right">
<div class="hack-head"><span><</span> HACK <span>></span></div>
<div style="color:#fff;font-size:13px;margin-top:8px;font-weight:bold">WIN GO 1 MIN</div>
<div class="period-box"><span id="FP">Loading...</span></div>
<div class="big-result" id="RES">--</div>
<div style="color:#fff;font-size:12px;margin-top:10px"><input type="checkbox" checked> Sound On</div>
<button class="predict" onclick="PREDICT()">PREDICT RESULT</button>
<div id="timer">Next in: <span id="sec">60</span>s</div>
<div style="color:#ff5a5a;font-size:9px;margin-top:15px;text-align:center">SERVER: MADRA EDITION - 1 MINUTE AUTO<br>This is for educational purpose</div>
</div>
</div>
<script>
let currentRes="--";
let lastMin=-1;
function getResult(){
 const colors=['Red','Green','Violet'];
 const sizes=['Big','Small'];
 return {num:Math.floor(Math.random()*10), color:colors[Math.floor(Math.random()*3)], size:sizes[Math.floor(Math.random()*2)]}
}
function updatePeriod(){
 const now=new Date();
 const period="202"+(now.getFullYear()-2020)+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+"1000"+(10001+now.getHours()*60+now.getMinutes());
 document.getElementById('FP').innerText=period;
 if(now.getMinutes()!=lastMin){
   let r=getResult();
   currentRes=`${r.size}<br><span style='font-size:14px'>${r.color} - ${r.num}</span>`;
   lastMin=now.getMinutes();
   document.getElementById('RES').innerHTML="???";
 }
}
function PREDICT(){ document.getElementById('RES').innerHTML=currentRes; }
setInterval(()=>{ updatePeriod(); let s=60-new Date().getSeconds(); document.getElementById('sec').innerText=s; },1000);
updatePeriod();
</script>
</body>
</html>
