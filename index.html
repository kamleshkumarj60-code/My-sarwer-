<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif}
.box{width:340px;background:#000;border:2px solid #00f5ff;border-radius:20px;padding:12px;box-shadow:0 0 20px #00f5ff}
.top{border:2px solid #00f5ff;border-radius:12px;padding:10px;text-align:center;color:#00f5ff;font-weight:bold;font-size:20px;letter-spacing:1px}
.vip{background:#00f5ff;color:#000;padding:2px 8px;border-radius:6px;font-size:12px;margin-left:5px}
.mid{border:2px solid #00f5ff;border-radius:12px;padding:8px;margin:8px 0;display:flex;justify-content:space-between;color:#00f5ff;font-size:12px}
.main{border:2px solid #00f5ff;border-radius:15px;height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden}
.auth{border:2px solid #fff;border-radius:10px;padding:12px 30px;transform:rotate(-10deg);text-align:center}
.auth b{color:#fff;letter-spacing:2px}
.auth span{color:#00f5ff;font-size:12px}
.btns{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:12px;font-weight:bold;border:2px solid #fff}
.login{background:linear-gradient(#fff,#00f5ff)}
.hide{background:#fff}
</style>
</head>
<body>
<div class=box>
  <div class=top>DEVIL X PANNLE <span class=vip>VIP</span></div>
  <div class=mid><span>LIVE MOD: ACTIVE</span><span>PING: 48MS</span></div>
  <div class=main>
    <div class=auth><b>AUTH REQUIRED</b><br><span>LOGIN TO CONNECT SERVER</span></div>
  </div>
  <div class=btns>
    <button class="btn login" onclick="alert('Ye sirf UI hai, real hack nahi hai')">LOGIN</button>
    <button class="btn hide">👁️‍🗨️ HIDE</button>
  </div>
</div>
</body>
</html>
