<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wingo Demo</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:Arial,sans-serif;
}
.container{
  max-width:430px;
  margin:auto;
  padding:18px;
}
h1{
  text-align:center;
  margin:10px 0 20px;
}
.card{
  background:#151d33;
  border:1px solid #293653;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
}
.label{
  color:#9ba8c7;
  font-size:14px;
}
.period{
  font-size:22px;
  font-weight:bold;
  margin-top:7px;
}
.timer{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  margin:10px 0;
}
.result{
  text-align:center;
  padding:18px;
  border-radius:14px;
  background:#0e1628;
}
.number{
  font-size:55px;
  font-weight:bold;
}
.color{
  font-size:20px;
  font-weight:bold;
}
.big{
  color:#ff5c5c;
}
.small{
  color:#4da3ff;
}
.green{color:#20d878}
.red{color:#ff5252}
.violet{color:#c56cff}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#4169e1;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.history{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #293653;
}
.dot{
  width:13px;
  height:13px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 WINGO DEMO</h1>

<div class="card">
  <div class="label">Current Period</div>
  <div class="period" id="period">100001</div>

  <div class="label" style="margin-top:15px">
    Next Result In
  </div>
  <div class="timer" id="timer">30</div>
</div>

<div class="card result">
  <div class="label">Demo Result</div>
  <div class="number" id="number">-</div>
  <div class="color" id="color">Waiting...</div>
  <div id="size" style="margin-top:8px">-</div>
</div>

<div class="card">
  <div class="label">History</div>
  <div id="history"></div>
</div>

<button onclick="newResult()">Generate Demo Result</button>

</div>

<script>
let period = 100001;
let timeLeft = 30;
let historyData = [];

const timerEl = document.getElementById("timer");
const periodEl = document.getElementById("period");
const numberEl = document.getElementById("number");
const colorEl = document.getElementById("color");
const sizeEl = document.getElementById("size");
const historyEl = document.getElementById("history");

function getColor(n){
  if(n === 0 || n === 5) return "Violet";
  if([1,3,7,9].includes(n)) return "Green";
  return "Red";
}

function getSize(n){
  return n >= 5 ? "BIG" : "SMALL";
}

function newResult(){

  const n = Math.floor(Math.random() * 10);
  const color = getColor(n);
  const size = getSize(n);

  numberEl.textContent = n;
  colorEl.textContent = color;
  sizeEl.textContent = size;

  colorEl.className = "color " + color.toLowerCase();

  historyData.unshift({
    period: period,
    number: n,
    color: color,
    size: size
  });

  if(historyData.length > 8){
    historyData.pop();
  }

  renderHistory();

  period++;
  periodEl.textContent = period;
}

function renderHistory(){
  historyEl.innerHTML = "";

  historyData.forEach(item => {

    let colorClass = item.color.toLowerCase();

    historyEl.innerHTML += `
      <div class="history">
        <span>${item.period}</span>
        <span>
          <b>${item.number}</b>
          <span class="dot ${colorClass}"
          style="background:currentColor"></span>
          ${item.color}
        </span>
        <span>${item.size}</span>
      </div>
    `;
  });
}

setInterval(() => {

  timeLeft--;

  if(timeLeft <= 0){
    timeLeft = 30;
    newResult();
  }

  timerEl.textContent = timeLeft;

},1000);
</script>

</body>
</html>
